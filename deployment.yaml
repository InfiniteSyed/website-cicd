apiVersion: apps/v1
kind: Deployment

metadata:
  name: website-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: website

  template:
    metadata:
      labels:
        app: website

    spec:
      containers:
      - name: website-container
        image: syedashu/website:v1

        ports:
        - containerPort: 80
